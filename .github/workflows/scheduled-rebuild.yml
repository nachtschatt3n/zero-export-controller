name: Scheduled Rebuild

# Weekly rebuild of the latest RELEASE (newest `v*` git tag) against a fresh
# base: re-pulls python:3.12-slim and re-runs the Dockerfile's apt upgrade with
# no build cache, so Debian security fixes land without a code change.
#
# Published as `<version>-b<YYYYMMDD>` (the rebuild-lane shape gods-eye-view
# uses). The plain `<version>` tag is deliberately NOT overwritten: the cluster
# pins it, and a pinned tag must not change content underneath it (AGENTS.md
# "Releases"). To deploy a rebuild, bump image.tag in cberg-home-nextgen.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to rebuild (default: newest v* tag)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "unexpected tag '$tag'"; exit 1;; esac
          git checkout --quiet "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (the release's own suite)
        run: |
          pip install -e '.[dev]'
          pytest -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (no-cache so base + apt are fresh)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.rel.outputs.version }}-b${{ steps.rel.outputs.build }}
            ${{ env.IMAGE }}:weekly
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rel.outputs.tag }}

      - name: Show published digest
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.rel.outputs.version }}-b${{ steps.rel.outputs.build }}"
