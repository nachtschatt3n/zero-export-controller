[project]
name = "zero-export-controller"
version = "0.1.0"
description = "Zero-export controller for Hoymiles via OpenDTU + Tibber Pulse via Home Assistant"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
